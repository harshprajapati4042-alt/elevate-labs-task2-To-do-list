<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Using HTML, CSS and JS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>My To-Do List</h1>
      <p>Welcome to your to-do list, make your daily task list. Click the checkbox to mark completed and double click to change or edit the task.</p>
      <div class="input-task">
        <input type="text" id="task" placeholder="Enter the task..." />
        <button class="task-btn" id="addBtn">Add task</button>
      </div>

      <ul id="taskList"></ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
